<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>MOVIE LIST</h1>
 <table>
        <tr>
            <th>Movie</th>
            <th>Director</th>
            <th>Year</th>
        </tr>
        {% for i in data %}
            <tr>
                <td>{{i.movie_name}}</td>
                <td>{{i.director}}</td>
                <td>{{i.year}}</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
